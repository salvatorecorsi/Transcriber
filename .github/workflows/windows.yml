name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked
      - name: Build portable application
        run: cargo build --release --locked
      - name: Prepare executable
        shell: pwsh
        run: |
          $package = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages[0]
          $binary = ($package.targets | Where-Object { $_.kind -contains 'bin' }).name
          Copy-Item -LiteralPath "target/release/$binary.exe" -Destination 'Transcriber.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: Transcriber-Windows-x64
          path: Transcriber.exe
          if-no-files-found: error
